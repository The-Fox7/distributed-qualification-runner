# orchestration: two-host-c2-zero-loss-v1
name: Sethia G1 zero-euro qualification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  wait-for-stale:
    name: Wait for older G1 runs to release Neon
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel older qualification runs and wait for release
        shell: bash
        run: |
          set -euo pipefail
          list_api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/g1.yml/runs?per_page=100"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          payload="$(curl -fsS --retry 3 --retry-all-errors "${auth[@]}" "$list_api")"
          older_ids="$(printf '%s' "$payload" | jq -r --argjson current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.id < $current and (.status == "in_progress" or .status == "queued")) | .id')"
          for id in $older_ids; do
            echo "CANCELLING_OLDER_G1_RUN=$id"
            curl -fsS --retry 3 --retry-all-errors -X POST "${auth[@]}" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || true
          done
          for attempt in $(seq 1 30); do
            payload="$(curl -fsS --retry 3 --retry-all-errors "${auth[@]}" "$list_api")"
            active="$(printf '%s' "$payload" | jq --argjson current "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id < $current and (.status == "in_progress" or .status == "queued"))] | length')"
            if [ "$active" -eq 0 ]; then
              echo "OLDER_G1_RUNS=NONE"
              exit 0
            fi
            echo "OLDER_G1_RUNS_ACTIVE=$active"
            sleep 5
          done
          echo "OLDER_G1_RUNS_TIMEOUT"
          exit 1

  shard:
    needs: wait-for-stale
    name: exact-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CONTROL_URL: https://jesus-administrators-innovations-mozilla.trycloudflare.com
      BUNDLE_SHA256: 6a6c2a341fa1eebaea8c3f4704e235d8ca943565c9498403154c3f044e63391d
      G1_MODE: exact
      G1_EXPECTED_HOSTS: "2"
      G1_SHARD: ${{ matrix.shard }}
      G1_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Obtain signed GitHub identity and fetch private qualification bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/sethia
          oidc_json="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sethia-stage8-g1")"
          oidc="$(printf '%s' "$oidc_json" | jq -r .value)"
          test -n "$oidc"
          echo "::add-mask::$oidc"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 -H "Authorization: Bearer $oidc" "$CONTROL_URL/bundle" -o work/bundle.tar.gz
          actual="$(sha256sum work/bundle.tar.gz | awk '{print $1}')"
          test "$actual" = "$BUNDLE_SHA256"
          tar -xzf work/bundle.tar.gz -C work/sethia
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 -H "Authorization: Bearer $oidc" "$CONTROL_URL/config" -o work/sethia/g1-config.json
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 -H "Authorization: Bearer $oidc" "$CONTROL_URL/runner" -o work/sethia/g1-runner.cjs

      - name: Install pinned Sethia dependencies
        shell: bash
        working-directory: work/sethia
        run: npm ci --no-audit --no-fund

      - name: Run exact distributed shard
        id: qualify
        shell: bash
        working-directory: work/sethia
        run: node g1-runner.cjs g1-config.json g1-result.json

      - name: Return raw evidence and external monitoring event
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f work/sethia/g1-result.json ]; then
            printf '{"schema":"sethia.stage8.g1-runner-missing.v1","mode":"%s","runId":"%s","shard":%s,"verified":false,"error":"RESULT_MISSING","externalSpendCents":0}\n' "$G1_MODE" "$G1_RUN_ID" "$G1_SHARD" > work/sethia/g1-result.json
          fi
          oidc_json="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sethia-stage8-g1")"
          oidc="$(printf '%s' "$oidc_json" | jq -r .value)"
          test -n "$oidc"
          echo "::add-mask::$oidc"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 -X POST -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" --data-binary @work/sethia/g1-result.json "$CONTROL_URL/report" >/dev/null
          printf '{"schema":"sethia.stage8.g1-external-alert.v1","mode":"%s","runId":"%s","shard":%s,"code":"G1_SHARD_EVIDENCE_DELIVERED","severity":"info","externalSpendCents":0}\n' "$G1_MODE" "$G1_RUN_ID" "$G1_SHARD" > work/g1-event.json
          curl -fsS --retry 5 --retry-all-errors --retry-delay 1 -X POST -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" --data-binary @work/g1-event.json "$CONTROL_URL/event" >/dev/null

      - name: Remove ephemeral credentials
        if: always()
        shell: bash
        run: rm -f work/sethia/g1-config.json work/bundle.tar.gz work/g1-event.json